name: tqms

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tqms
      POSTGRES_USER: ${POSTGRES_USER:?Add POSTGRES_USER to the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to the root .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d tqms"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: migrate
    restart: "no"
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/tqms?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/tqms?schema=public
      CLIENT_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      NODE_ENV: development
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
